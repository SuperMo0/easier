name: Apply

# Dispatched once a day by the tailoring Routine with the day's shortlisted job folders.
# Submits each application in a real browser, records what actually happened, and sends one
# WhatsApp message per job with the tailored CV and the outcome.

on:
  workflow_dispatch:
    inputs:
      job_dirs:
        description: 'Space-separated job folders, e.g. "jobs/2026-09-23_careem_backend-engineer"'
        required: true
        type: string
      dry_run:
        description: 'Fill forms without submitting (and send nothing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: main
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 xvfb
          pip install requests pyyaml markdown weasyprint playwright playwright-stealth
          python -m playwright install --with-deps chromium chrome

      # Folder names reach the shell through the environment, never through `${{ }}`
      # interpolation, and each is checked against the jobs/<name> shape before use.
      - name: Render CVs and cover letters
        env:
          JOB_DIRS: ${{ inputs.job_dirs }}
        run: |
          for d in $JOB_DIRS; do
            if [[ ! "$d" =~ ^jobs/[A-Za-z0-9._-]+$ ]] || [[ ! -f "$d/job.json" ]]; then
              echo "::warning::skipping invalid job folder: $d"; continue
            fi
            # if-blocks, not `[[ ]] &&`: a missing file must not become the step's exit status.
            if [[ -f "$d/cv.md" ]]; then python scripts/render_pdf.py "$d/cv.md" "$d/Mwafak_Almahaini_CV.pdf"; fi
            if [[ -f "$d/cover-letter.md" ]]; then python scripts/render_pdf.py "$d/cover-letter.md" "$d/Mwafak_Almahaini_Cover_Letter.pdf"; fi
          done

      - name: Apply
        env:
          JOB_DIRS: ${{ inputs.job_dirs }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # xvfb gives Chromium a virtual display, so it runs as a normal headed browser.
          if [[ "$DRY_RUN" == "true" ]]; then
            xvfb-run -a python scripts/apply.py --dry-run $JOB_DIRS
          else
            xvfb-run -a python scripts/apply.py $JOB_DIRS
          fi

      - name: Keep form screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-screenshots
          path: apply-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Send notifications
        if: inputs.dry_run != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE }}
          WHATSAPP_TEMPLATE_LANG: ${{ secrets.WHATSAPP_TEMPLATE_LANG }}
        run: python scripts/deliver.py

      - name: Commit outcomes
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "easier-apply"
          git config user.email "noreply@github.com"
          git add -A jobs
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Apply: record outcomes"
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin "$BRANCH"; then
              # Only the generated index can collide; rebuild it rather than merge it.
              python scripts/index.py && git add jobs/INDEX.md && GIT_EDITOR=true git rebase --continue \
                || { git rebase --abort; exit 1; }
            fi
            python scripts/index.py
            if ! git diff --quiet -- jobs/INDEX.md; then
              git add jobs/INDEX.md && git commit -m "Rebuild job index"
            fi
            git push origin "HEAD:$BRANCH" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

name: Discover

# Pulls job postings from company ATS boards and commits new ones to jobs/incoming/, where
# the tailoring Routine picks them up. Runs on GitHub Actions because the Claude sandbox has
# no outbound network access.

on:
  schedule:
    - cron: '0 5,17 * * *'   # twice daily, 05:00 and 17:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: true
        default: fetch
        type: choice
        options:
          - fetch    # pull postings from every verified board
          - verify   # probe every company, record which ATS serves it, commit the result
          - probe    # try one slug against every ATS and print the outcome
          - prune    # delete stale job records only
          - find-slugs      # sweep slug variants for unverified companies
          - fetch-leads     # fetch full postings from leads the model found by searching
          - detect-ats      # read company careers pages and identify their job board
          - probe-workday  # sweep Workday host/site shapes for one tenant
          - refresh        # re-read full descriptions for open job folders; logs the HTTP status of any that fail
      slug:
        description: 'Company slug — only used by probe'
        required: false
        type: string

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml

      # Inputs reach the script through the environment rather than `${{ }}` interpolation
      # into the shell body.
      - name: Probe one company
        if: inputs.mode == 'probe'
        env:
          SLUG: ${{ inputs.slug }}
        run: python scripts/discover.py probe "$SLUG"

      - name: Probe Workday for a tenant
        if: inputs.mode == 'probe-workday'
        env:
          SLUG: ${{ inputs.slug }}
        run: python scripts/discover.py probe-workday "$SLUG"

      - name: Detect job boards from careers pages
        if: inputs.mode == 'detect-ats'
        run: python scripts/detect_ats.py

      - name: Fetch postings from model-found leads
        if: inputs.mode == 'fetch-leads'
        run: python scripts/fetch_leads.py

      - name: Refresh job descriptions
        if: inputs.mode == 'refresh'
        run: python scripts/fetch_leads.py --refresh

      - name: Find slugs for unverified companies
        if: inputs.mode == 'find-slugs'
        run: python scripts/discover.py find-slugs

      - name: Verify every company
        if: inputs.mode == 'verify'
        run: python scripts/discover.py verify

      - name: Fetch postings
        if: inputs.mode == 'fetch' || github.event_name == 'schedule'
        run: python scripts/discover.py fetch

      - name: Prune stale job records
        if: inputs.mode == 'fetch' || inputs.mode == 'prune' || github.event_name == 'schedule'
        run: python scripts/discover.py prune

      - name: Rebuild the job index
        if: inputs.mode != 'probe' && inputs.mode != 'probe-workday'
        run: python scripts/index.py

      - name: Commit results
        if: inputs.mode != 'probe' && inputs.mode != 'probe-workday'
        env:
          BRANCH: ${{ github.ref_name }}
          MODE: ${{ inputs.mode || 'fetch' }}
        run: |
          git config user.name  "easier-discovery"
          git config user.email "noreply@github.com"
          git add -A jobs companies
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Discovery: $MODE run"
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin "$BRANCH"; then
              # Only the generated index can collide; rebuild it rather than merge it.
              python scripts/index.py && git add jobs/INDEX.md && GIT_EDITOR=true git rebase --continue \
                || { git rebase --abort; exit 1; }
            fi
            python scripts/index.py
            if ! git diff --quiet -- jobs/INDEX.md; then
              git add jobs/INDEX.md && git commit -m "Rebuild job index"
            fi
            git push origin "HEAD:$BRANCH" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

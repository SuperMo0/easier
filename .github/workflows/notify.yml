name: Notify

# Triggered by the tailoring Routine once a tailored CV has been committed, or manually
# for testing. Renders the CV to PDF and sends it over WhatsApp with the apply link.

on:
  workflow_dispatch:
    inputs:
      message:
        description: Message body to send
        required: true
        type: string
      cv_path:
        description: Path to a markdown CV to attach as PDF (optional)
        required: false
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    # Credentials live as environment secrets, which are only injected into jobs that
    # declare the environment — without this they resolve to empty strings.
    environment: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        if: inputs.cv_path != ''
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install Python dependencies
        run: |
          pip install requests
          if [ -n "${CV_PATH}" ]; then pip install markdown weasyprint; fi
        env:
          CV_PATH: ${{ inputs.cv_path }}

      # Inputs reach the shell through the environment, never through `${{ }}` interpolation
      # into the script body: these values carry scraped job titles and would otherwise be
      # executable.
      # The attachment keeps a meaningful name: a job's cv.md goes out as the candidate's CV,
      # anything else (a daily report) under its own file name.
      - name: Render attachment to PDF
        if: inputs.cv_path != ''
        env:
          CV_PATH: ${{ inputs.cv_path }}
        run: |
          if [[ ! "$CV_PATH" =~ ^(jobs|reports)/[A-Za-z0-9._/-]+\.md$ ]] || [[ "$CV_PATH" == *..* ]] || [[ ! -f "$CV_PATH" ]]; then
            echo "::error::refusing attachment path: $CV_PATH"; exit 1
          fi
          NAME=$(basename "$CV_PATH" .md)
          [ "$NAME" = "cv" ] && NAME="Mwafak_Almahaini_CV"
          mkdir -p /tmp/out
          python scripts/render_pdf.py "$CV_PATH" "/tmp/out/$NAME.pdf"
          echo "ATTACHMENT=/tmp/out/$NAME.pdf" >> "$GITHUB_ENV"

      - name: Send WhatsApp message
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE }}
          WHATSAPP_TEMPLATE_LANG: ${{ secrets.WHATSAPP_TEMPLATE_LANG }}
          MESSAGE: ${{ inputs.message }}
        run: |
          if [ -n "${ATTACHMENT:-}" ]; then
            python scripts/send_whatsapp.py --message "$MESSAGE" --document "$ATTACHMENT"
          else
            python scripts/send_whatsapp.py --message "$MESSAGE"
          fi

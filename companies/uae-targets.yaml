# UAE target companies.
#
# Most companies host their careers page on a third-party applicant tracking system (ATS) that
# exposes a public JSON board API. Fetching that API is far more reliable than scraping HTML.
#
# `ats` and `slug` are UNVERIFIED guesses until proven. Find the real values with:
#
#     python scripts/discover.py probe <slug>
#
# which tries every supported ATS and reports which one answers. Set `verified: true` once a
# board returns real postings — `fetch` skips everything unverified.
#
# Supported: greenhouse, lever, ashby, smartrecruiters, recruitee, teamtailor, personio
#
# Companies on Workday or a bespoke careers page need separate handling; mark those
# `ats: workday` or `ats: custom` and leave them unverified for now.

companies:
  # ---- Ride-hailing, delivery, marketplaces ----
  - name: Careem
    slug: careem
    ats: greenhouse
    verified: false
  - name: Talabat
    slug: talabat
    ats: smartrecruiters
    verified: false
